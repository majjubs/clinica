<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
        }

        .login-container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .login-container input {
            width: 100%;
            padding: 5px;
            margin: 10px 0;
            border-radius: 4px;
            border: 1px solid #ccc; 
        }

        .login-container button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .login-container button:hover {
            background-color: #0056b3;
        }

        .error-message {
            color: red;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
  
    <div class="login-container">
        <h2>Login</h2>

        <form id="login-form" onsubmit="return validarLogin(event)">
            <div>
                <label for="login">Login:</label>
                <input type="text" id="login" name="login" required>
            </div>
            <div>
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required>
            </div>
            <button type="submit">Entrar</button>
            <p class="error-message" id="error-message">Login ou senha inválidos. Tente novamente.</p>
        </form>
    </div>

    <script>
        // Função para validar o login e senha
        function validarLogin(event) {
            event.preventDefault();  // Impede o envio do formulário padrão

            // Pega os valores dos campos de login e senha
            const login = document.getElementById('login').value;
            const senha = document.getElementById('senha').value;

            // Definindo credenciais válidas
            const loginValido = "admin";  // Login
            const senhaValida = "senha123";  // Senha

            // Verificar se as credenciais estão corretas
            if (login === loginValido && senha === senhaValida) {
                // Redireciona para a página principal (ou qualquer página interna que você deseja)
                window.location.href = "adm.jsp"; // Substitua "pagina_admin.html" pelo seu caminho real
            } else {
                // Exibe a mensagem de erro
                document.getElementById('error-message').style.display = 'block';
            }
        }
    </script>

</body>
</html>
